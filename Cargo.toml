[package]
name = "juicetop"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A btop-style terminal dashboard for your PC's power draw, electricity cost and CO2, with history"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/CookedApps/juicetop"
exclude = ["docs/", ".github/", "scripts/"]
keywords = ["power", "energy", "monitoring", "tui", "electricity"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
nvml-wrapper = "0.13"
ratatui = "0.30"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
toml = "1.2"
ureq = { version = "3.5", features = ["json"] }

[dev-dependencies]
tempfile = "3"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
